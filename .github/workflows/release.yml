# Builds the server for each platform when a version tag (v*) is pushed and
# attaches the archives to a GitHub release. Release builds embed the
# browser client (static/, via build.rs), so each archive is the single
# executable plus the license files.
#
#   git tag v0.2.0 && git push origin v0.2.0

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: blast-arena

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low (2.35).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, test: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, test: true }
          - { target: aarch64-apple-darwin, os: macos-latest, test: true }
          # Cross-compiled on the Apple Silicon runner.
          - { target: x86_64-apple-darwin, os: macos-latest, test: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, test: true }
    steps:
      - uses: actions/checkout@v4

      # The browser client is TypeScript, compiled into static/js and
      # embedded by build.rs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the browser client
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::warning::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
          fi

      # bots_play_well measures bot skill over random games and can fail by
      # chance; it shouldn't block a release.
      - name: Test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }} -- --skip bots_play_well

      - name: Build
        run: cargo build --release --locked --bin ${{ env.BIN }} --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          name="$BIN-$GITHUB_REF_NAME-${{ matrix.target }}"
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$BIN$ext" "dist/$name/"
          cp LICENSE NOTICE README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release and upload the executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          ls -l
          # Tags with a suffix (v1.2.0-rc.1) become pre-releases.
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --title "Blast Arena $GITHUB_REF_NAME" --generate-notes --verify-tag $pre
          fi
