[package]
name = "blast-arena"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
log = "0.4.35"
rmp-serde = "1.3.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "tracing-log"] }

[dev-dependencies]
serde_json = "1.0.154"
