[package]
name = "blast-arena"
version = "0.8.0"
edition = "2024"
description = "A real-time multiplayer bomb arena game server with a browser client"
authors = ["Yehor Smoliakov <egorsmkv@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/RustedBytes/blast-arena"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
log = "0.4.35"
rmp-serde = "1.3.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "tracing-log"] }
wtransport = "0.7.2"

# musl's allocator is slow under many threads; the Alpine image (a musl
# build) uses mimalloc instead. Other targets keep the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]

# `cargo clippy` runs the pedantic group. The four numeric-cast lints are
# allowed: the simulation converts between tile coordinates (bounded by the
# map size), f32 positions, tick counters and wire integers on every tick,
# and those values are range-checked where they enter (the MessagePack
# decoder clamps client input, the encoder picks the width from the value).
# Conversions of outside data that can really overflow, such as stored
# profile counts and durations, use `try_from` instead.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
